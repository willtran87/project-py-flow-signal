name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff build
      - run: ruff check src tests scripts --select F,I
      - run: ruff format --check src tests scripts
      - run: python -m unittest discover -s tests
      - run: python scripts/benchmark_scan.py --files 40
      - run: python scripts/benchmark_accuracy.py --check benchmarks/baseline.json
      - run: python scripts/dogfood.py
      - run: python scripts/validate_review_workflow.py
      - run: python scripts/validate_typed_flow.py
      - run: python scripts/validate_supervision.py
      - run: python scripts/validate_product_features.py
      - run: python scripts/validate_workflow_enhancements.py
      - run: python scripts/benchmark_incremental.py --files 40
      - run: python -m build --wheel
